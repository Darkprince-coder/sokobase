<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — Hometown SokoBase</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
      background: #FAF7F2;
      color: #14201B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    img { width: 64px; height: 64px; }
    h1 { font-size: 1.25rem; margin: 0; }
    p { color: #6b756e; max-width: 34ch; margin: 0; }
    button {
      margin-top: 8px;
      background: #1F7A4D;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>Check your connection — Hometown SokoBase needs internet to load listings.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
